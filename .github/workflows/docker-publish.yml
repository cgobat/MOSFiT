name: Build and push MOSFiT image

# Builds the MOSFiT CPU runtime image and pushes it to Docker Hub, from which the
# CVMFS unpacked sync (opened by a separate PR against
# opensciencegrid/cvmfs-singularity-sync) mirrors it to
# /cvmfs/singularity.opensciencegrid.org/<user>/mosfit:<tag>. PRs build without
# pushing, so a broken image fails the check.
#
# Needs repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN. MOSFiT is CPU-only
# (emcee/dynesty), so there is no GPU variant.

on:
  push:
    branches: [main, docker]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - mosfit/**
      - setup.py
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          # Full target image (e.g. an org: "someorg/mosfit"). Falls back to
          # <login user>/mosfit when the repo variable isn't set.
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          repo="${DOCKERHUB_IMAGE:-${DOCKERHUB_USERNAME}/mosfit}"
          sha="${GITHUB_SHA::12}"
          echo "tags=${repo}:latest,${repo}:${sha}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
