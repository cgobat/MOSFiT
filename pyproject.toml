[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mosfit"
dynamic = ["version"]
description = "Modular software for fitting semi-analytical model predictions to observed astronomical transient data."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "James Guillochon", email = "guillochon@gmail.com" },
    { name = "Matt Nicholl" },
]
keywords = ["astronomy", "fitting", "monte carlo", "modeling"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "astrocats>=0.5.0",
    "astropy>=7.1",
    "dynesty>=3.1",
    "emcee>=3.0.2",
    "extinction>=0.2.2",
    "h5py>=3.8.0",
    "inflect>=1.0.0",
    "matplotlib>=3.0.0",
    "nbstripout>=0.2.9",
    "numexpr>=2.6.1",
    "numpy>=2.3",
    "pandas>=2.2",
    "palettable>=2.1.1",
    "schwimmbad>=0.4.2",
    "scipy>=1.2",
    "seaborn>=0.7.1",
    "six>=1.0.0",
]

[project.optional-dependencies]
mpi = [
    "mpi4py>=3.1.6",
]
sedona = [
    "torch",
]
docs = [
    "sphinx>=7.0,<8",
    "sphinx_rtd_theme>=2.0",
    "sphinx_automodapi",
    "sphinxcontrib-autoprogram",
    "numpydoc",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/guillochon/mosfit"
Documentation = "https://mosfit.readthedocs.io/"
Download = "https://github.com/guillochon/mosfit/tarball/1.3"

[project.scripts]
mosfit = "mosfit.main:main"

[tool.hatch.version]
path = "mosfit/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/mosfit",
    "/LICENSE",
    "/README.md",
    "/test.py",
    "/test.sh",
]

[tool.hatch.build.targets.wheel]
packages = ["mosfit"]

# astrocats 0.5.0 (astrocatalogs/astrocats#95) is not on PyPI yet.
# Drop this source once 0.5.0 is published; the specifier above is enough.
[tool.uv.sources]
astrocats = { git = "https://github.com/astrocatalogs/astrocats", branch = "python-3.14-uv" }
